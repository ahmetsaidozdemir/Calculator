services:
  backend:
    build: ./backend
    image: calculator-backend
    restart: unless-stopped
    environment:
      PORT: "8080"
#    ports:
#      - "${BACKEND_PORT}:8080"
    healthcheck:
      test: ["CMD", "/server", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 3s

  frontend:
    build: 
      context: ./frontend
#      args:
#        VITE_BACKEND_EXTERNAL_URI: ${VITE_BACKEND_EXTERNAL_URI}
    image: calculator-frontend
    restart: unless-stopped
    environment:
      BACKEND_INTERNAL_URI: "${BACKEND_INTERNAL_URI}"
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT}:80"
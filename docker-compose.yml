services:
  backend:
    build: ./backend
    image: calculator-backend
    restart: unless-stopped
    environment:
      PORT: "8080"
    ports:
      - "${BACKEND_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD", "/server", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 3s

  frontend:
    build: 
      context: ./frontend
      args:
        VITE_BASE_URI: ${VITE_BASE_URI:-http://localhost:8081}
    image: calculator-frontend
    restart: unless-stopped
    environment:
      BACKEND_URI: "${BACKEND_URI:-http://backend:8080}"
#    depends_on:
#      backend:
#        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"
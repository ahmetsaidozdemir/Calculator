# Two images, one command:  docker compose up --build
# Open http://localhost:8080  (change the port with FRONTEND_PORT=3000 docker compose up)
services:
  backend:
    build: ./backend
    image: calculator-backend
    restart: unless-stopped
    environment:
      PORT: "8080"
    # Reachable only from the other containers; the browser goes through the frontend.
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "/server", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 3s

  frontend:
    build: ./frontend
    image: calculator-frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8080
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"
